name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Release please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
      - name: Debug release-please output
        run: |
          echo "Debug: print release-please output"
          echo "${{ toJson(steps.release.outputs) }}"

  publish:
    name: Publish
    needs: release
    if: needs.release.releases_created == true
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Print release please output"
          echo "Do something"
